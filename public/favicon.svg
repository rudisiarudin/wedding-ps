<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D342D" />
      <stop offset="100%" stop-color="#54543E" />
    </linearGradient>
  </defs>
  <!-- Background with elegant rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <!-- Delicate inner luxury frame -->
  <rect x="7" y="7" width="114" height="114" rx="22" fill="none" stroke="#DDCCB7" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Monogram PS -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="'Italiana', 'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
    font-weight="500"
    font-size="62" 
    letter-spacing="2"
    fill="#EDE7DB">
    PS
  </text>
</svg>
